<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompressNow - Compresor de Imágenes Gratuito</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .upload-zone {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }
        
        .upload-zone:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }
        
        .upload-zone.dragover {
            border-color: #764ba2;
            background: #f0f4ff;
        }
        
        .upload-zone input {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .upload-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            font-size: 14px;
            color: #999;
        }
        
        .preview-section {
            display: none;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .image-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .image-box {
            text-align: center;
        }
        
        .image-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        
        .controls {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .control-item {
            margin-bottom: 15px;
        }
        
        .control-item:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        
        select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }
        
        .savings {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .savings.positive {
            background: #d4edda;
            color: #155724;
        }
        
        .savings.negative {
            background: #f8d7da;
            color: #721c24;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-reset:hover {
            background: #e0e0e0;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .image-row {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗜️ CompressNow</h1>
            <p>Comprime imágenes sin perder calidad</p>
        </div>
        
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Arrastra tu imagen aquí</div>
            <div class="upload-hint">o haz clic para seleccionar</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div class="preview-section" id="previewSection">
            <div class="image-row">
                <div class="image-box">
                    <div class="image-label">Original</div>
                    <img id="originalImage" class="image-preview" alt="Original">
                </div>
                <div class="image-box">
                    <div class="image-label">Comprimida</div>
                    <img id="compressedImage" class="image-preview" alt="Comprimida">
                </div>
            </div>
            
            <div class="controls">
                <div class="control-item">
                    <div class="control-label">
                        <span>Calidad</span>
                        <span id="qualityValue">80</span>%
                    </div>
                    <input type="range" id="quality" min="10" max="100" value="80">
                </div>
                
                <div class="control-item">
                    <div class="control-label">Formato de salida</div>
                    <select id="format">
                        <option value="auto">Automático (mantener original)</option>
                        <option value="image/jpeg">JPEG</option>
                        <option value="image/png">PNG</option>
                        <option value="image/webp">WebP</option>
                    </select>
                </div>
            </div>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Tamaño Original</div>
                    <div class="stat-value" id="originalSize">0 KB</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Tamaño Comprimido</div>
                    <div class="stat-value" id="compressedSize">0 KB</div>
                </div>
            </div>
            
            <div id="savingsMessage" class="savings" style="display: none;"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Comprimiendo...</p>
            </div>
            
            <div class="buttons">
                <button class="btn-download" id="downloadBtn">⬇️ Descargar</button>
                <button class="btn-reset" id="resetBtn">↻ Nueva</button>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 CompressNow | Compresor gratuito de imágenes</p>
        </div>
    </div>
    
    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const originalImage = document.getElementById('originalImage');
        const compressedImage = document.getElementById('compressedImage');
        const quality = document.getElementById('quality');
        const qualityValue = document.getElementById('qualityValue');
        const format = document.getElementById('format');
        const originalSize = document.getElementById('originalSize');
        const compressedSize = document.getElementById('compressedSize');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loading = document.getElementById('loading');
        const savingsMessage = document.getElementById('savingsMessage');
        
        let currentFile = null;
        let compressedBlob = null;
        let originalMimeType = null;
        
        // Eventos de clic
        uploadZone.addEventListener('click', () => fileInput.click());
        
        // Eventos de drag and drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        // Eventos de input
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        quality.addEventListener('input', () => {
            qualityValue.textContent = quality.value;
            compressImage();
        });
        
        format.addEventListener('change', compressImage);
        
        downloadBtn.addEventListener('click', downloadImage);
        resetBtn.addEventListener('click', reset);
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Por favor selecciona una imagen válida');
                return;
            }
            
            currentFile = file;
            originalMimeType = file.type;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImage.src = e.target.result;
                originalSize.textContent = formatSize(file.size);
                previewSection.classList.add('active');
                compressImage();
            };
            reader.readAsDataURL(file);
        }
        
        function compressImage() {
            if (!currentFile) return;
            
            loading.classList.add('active');
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                
                const qualityNum = parseInt(quality.value) / 100;
                let mimeType = format.value === 'auto' ? originalMimeType : format.value;
                
                // Validar formato
                if (!['image/jpeg', 'image/png', 'image/webp'].includes(mimeType)) {
                    mimeType = 'image/jpeg';
                }
                
                canvas.toBlob(
                    (blob) => {
                        compressedBlob = blob;
                        compressedSize.textContent = formatSize(blob.size);
                        compressedImage.src = URL.createObjectURL(blob);
                        loading.classList.remove('active');
                        updateSavings();
                    },
                    mimeType,
                    qualityNum
                );
            };
            
            img.src = originalImage.src;
        }
        
        function updateSavings() {
            const original = currentFile.size;
            const compressed = compressedBlob.size;
            const diff = original - compressed;
            const percent = ((Math.abs(diff) / original) * 100).toFixed(1);
            
            if (diff > 0) {
                savingsMessage.className = 'savings positive';
                savingsMessage.textContent = `✓ Ahorrado: ${formatSize(diff)} (${percent}%)`;
            } else if (diff < 0) {
                savingsMessage.className = 'savings negative';
                savingsMessage.textContent = `⚠ Aumentado: ${formatSize(Math.abs(diff))} (${percent}%)`;
            } else {
                savingsMessage.style.display = 'none';
                return;
            }
            savingsMessage.style.display = 'block';
        }
        
        function downloadImage() {
            if (!compressedBlob) return;
            
            const ext = format.value === 'auto' ? getExtension(originalMimeType) : getExtension(format.value);
            const url = URL.createObjectURL(compressedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `compressed-${Date.now()}.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function reset() {
            currentFile = null;
            compressedBlob = null;
            fileInput.value = '';
            previewSection.classList.remove('active');
            quality.value = 80;
            qualityValue.textContent = '80';
            format.value = 'auto';
            savingsMessage.style.display = 'none';
        }
        
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }
        
        function getExtension(mimeType) {
            const map = {
                'image/jpeg': 'jpg',
                'image/png': 'png',
                'image/webp': 'webp',
                'image/gif': 'gif',
                'image/bmp': 'bmp'
            };
            return map[mimeType] || 'jpg';
        }
    </script>
</body>
</html>
